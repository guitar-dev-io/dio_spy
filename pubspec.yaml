name: net_spy
description: A lightweight Dio HTTP inspector with clean minimal UI.
homepage: https://github.com/7wilightxdev/net_spy
repository: https://github.com/7wilightxdev/net_spy
version: 0.0.5

environment:
  sdk: ^3.0.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ">=5.2.0 <6.0.0"
  shake_gesture: ^2.1.0
  json_visualizer: 0.0.2
  shared_preferences: ^2.5.5
  share_plus: ">=7.2.0 <14.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true